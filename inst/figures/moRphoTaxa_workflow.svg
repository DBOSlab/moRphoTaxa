<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1060" font-family="'Open Sans', Helvetica, Arial, sans-serif">
  <!-- Palette: Bootstrap/spacelab grays used across the moRphoTaxa website
       (#F8F9FA gray-100, #E9ECEF gray-200, #DEE2E6 gray-300, #ADB5BD gray-500,
        #6C757D gray-600, #495057 gray-700, #343A40 gray-800), mixed with the
       greens of the moRphoTaxa hex sticker (#1E5631, #3B7A3A, #9CC283, #E4EFDC):
       green marks moRphoTaxa itself, grays the structure and companion packages -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6C757D"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="1060" fill="#F8F9FA"/>

  <!-- Title -->
  <text x="40" y="44" font-size="24" font-weight="700" fill="#1E5631">moRphoTaxa workflow</text>
  <text x="40" y="66" font-size="13" fill="#6C757D">From herbarium specimens to morphometric and ecogeographic evidence for species delimitation</text>

  <!-- ============ STAGE 1: Get herbarium data ============ -->
  <text x="40" y="106" font-size="14" font-weight="700" fill="#3B7A3A">1. GET HERBARIUM DATA</text>

  <g font-size="13.5">
    <rect x="230" y="118" width="220" height="58" rx="10" fill="#F1F3F5" stroke="#ADB5BD" stroke-width="1.5" stroke-dasharray="6 3"/>
    <text x="340" y="143" text-anchor="middle" fill="#343A40" font-weight="600">refloraR</text>
    <text x="340" y="162" text-anchor="middle" fill="#6C757D" font-size="11">REFLORA Virtual Herbarium</text>

    <rect x="490" y="118" width="220" height="58" rx="10" fill="#F1F3F5" stroke="#ADB5BD" stroke-width="1.5" stroke-dasharray="6 3"/>
    <text x="600" y="143" text-anchor="middle" fill="#343A40" font-weight="600">jabotR</text>
    <text x="600" y="162" text-anchor="middle" fill="#6C757D" font-size="11">JABOT</text>

    <rect x="750" y="118" width="220" height="58" rx="10" fill="#F1F3F5" stroke="#ADB5BD" stroke-width="1.5" stroke-dasharray="6 3"/>
    <text x="860" y="143" text-anchor="middle" fill="#343A40" font-weight="600">plantR</text>
    <text x="860" y="162" text-anchor="middle" fill="#6C757D" font-size="11">speciesLink · GBIF</text>
  </g>

  <!-- stage 1 -> stage 2: the three sources merge on a bus into barRoso -->
  <g fill="none" stroke="#6C757D" stroke-width="2">
    <path d="M340,176 L340,198 L860,198 L860,176"/>
    <path d="M600,176 L600,198"/>
    <path d="M480,198 L480,234" marker-end="url(#arrow)"/>
  </g>

  <!-- ============ STAGE 2: Clean occurrence data ============ -->
  <text x="40" y="224" font-size="14" font-weight="700" fill="#3B7A3A">2. CLEAN OCCURRENCE DATA</text>

  <g font-size="13.5">
    <rect x="380" y="236" width="200" height="58" rx="10" fill="#F1F3F5" stroke="#ADB5BD" stroke-width="1.5" stroke-dasharray="6 3"/>
    <text x="480" y="261" text-anchor="middle" fill="#343A40" font-weight="600">barRoso</text>
    <text x="480" y="280" text-anchor="middle" fill="#6C757D" font-size="11">merge · deduplicate · harmonize</text>

    <rect x="620" y="236" width="200" height="58" rx="10" fill="#F1F3F5" stroke="#ADB5BD" stroke-width="1.5" stroke-dasharray="6 3"/>
    <text x="720" y="261" text-anchor="middle" fill="#343A40" font-weight="600">lcvplants</text>
    <text x="720" y="280" text-anchor="middle" fill="#6C757D" font-size="11">standardize names (LCVP)</text>
  </g>
  <line x1="580" y1="265" x2="616" y2="265" stroke="#6C757D" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- curated spreadsheet feeds both matrix builders. The bus (y=340) sits
       above the stage-3 header baseline but to the right of its short text,
       so no connector crosses the header glyphs. -->
  <path d="M720,294 L720,340" fill="none" stroke="#6C757D" stroke-width="2"/>
  <text x="732" y="322" font-size="11.5" font-style="italic" fill="#6C757D">curated occurrence spreadsheet (.xlsx)</text>
  <path d="M720,340 L375,340 L375,370" fill="none" stroke="#6C757D" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M720,340 L934,340 L934,468" fill="none" stroke="#6C757D" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ============ STAGE 3: Build matrices ============ -->
  <text x="40" y="360" font-size="14" font-weight="700" fill="#3B7A3A">3. BUILD MATRICES</text>

  <g font-size="13.5">
    <rect x="60" y="372" width="170" height="58" rx="10" fill="#FFFFFF" stroke="#ADB5BD" stroke-width="1.5"/>
    <text x="145" y="397" text-anchor="middle" fill="#1E5631" font-weight="600">traits_database</text>
    <text x="145" y="416" text-anchor="middle" fill="#6C757D" font-size="11">trait names &amp; codes</text>

    <rect x="270" y="372" width="210" height="58" rx="10" fill="#FFFFFF" stroke="#ADB5BD" stroke-width="1.5"/>
    <text x="375" y="397" text-anchor="middle" fill="#1E5631" font-weight="600">morph_add_traits()</text>
    <text x="375" y="416" text-anchor="middle" fill="#6C757D" font-size="11">default + taxon-specific presets</text>

    <rect x="520" y="372" width="200" height="58" rx="10" fill="#FFFFFF" stroke="#ADB5BD" stroke-width="1.5" stroke-dasharray="3 3"/>
    <text x="620" y="397" text-anchor="middle" fill="#495057" font-weight="600" font-style="italic">Measure specimens</text>
    <text x="620" y="416" text-anchor="middle" fill="#6C757D" font-size="11">fill_missing_traits() for trials</text>
  </g>
  <line x1="230" y1="401" x2="266" y2="401" stroke="#6C757D" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="480" y1="401" x2="516" y2="401" stroke="#6C757D" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M620,430 L620,450 L266,450 L266,468" fill="none" stroke="#6C757D" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- the two matrices every analysis starts from -->
  <g font-size="14">
    <rect x="148" y="470" width="236" height="62" rx="10" fill="#E4EFDC" stroke="#3B7A3A" stroke-width="2"/>
    <text x="266" y="496" text-anchor="middle" fill="#1E5631" font-weight="700">morph_matrix_setting()</text>
    <text x="266" y="516" text-anchor="middle" fill="#495057" font-size="11">specimen × trait matrix · veg / flo / fru</text>

    <rect x="816" y="470" width="236" height="62" rx="10" fill="#E4EFDC" stroke="#3B7A3A" stroke-width="2"/>
    <text x="934" y="496" text-anchor="middle" fill="#1E5631" font-weight="700">geo_matrix_setting()</text>
    <text x="934" y="516" text-anchor="middle" fill="#495057" font-size="11">WorldClim + SoilGrids per specimen</text>
  </g>

  <!-- matrices -> stage 4 columns; both also feed the central column -->
  <g fill="none" stroke="#6C757D" stroke-width="2">
    <path d="M266,532 L266,556" marker-end="url(#arrow)"/>
    <path d="M934,532 L934,556" marker-end="url(#arrow)"/>
    <path d="M384,501 L600,501 L816,501"/>
    <path d="M600,501 L600,556" marker-end="url(#arrow)"/>
  </g>

  <!-- ============ STAGE 4: Inference (full-width band) ============ -->
  <rect x="40" y="560" width="1120" height="386" rx="16" fill="#E9ECEF" stroke="#6C757D" stroke-width="2"/>
  <text x="60" y="588" font-size="14" font-weight="700" fill="#1E5631">4. MORPHOMETRIC &amp; ECOGEOGRAPHIC INFERENCE</text>

  <g font-size="11.5" font-weight="700" fill="#3B7A3A" letter-spacing="0.4">
    <text x="266" y="614" text-anchor="middle">MORPHOMETRIC ANALYSES</text>
    <text x="600" y="614" text-anchor="middle">MORPHOLOGY × ENVIRONMENT</text>
    <text x="934" y="614" text-anchor="middle">ECOGEOGRAPHIC ANALYSES</text>
  </g>

  <g font-size="12.5">
    <!-- Morphometric groups: 2 x 2 grid + a full-width row -->
    <rect x="60" y="626" width="200" height="92" rx="10" fill="#FFFFFF" stroke="#ADB5BD" stroke-width="1.5"/>
    <text x="160" y="646" text-anchor="middle" fill="#6C757D" font-size="11" font-weight="700">Data quality</text>
    <text x="160" y="666" text-anchor="middle" fill="#1E5631" font-weight="600">morph_normality()</text>
    <text x="160" y="684" text-anchor="middle" fill="#1E5631" font-weight="600">morph_boxplots()</text>
    <text x="160" y="702" text-anchor="middle" fill="#1E5631" font-weight="600">morph_similarity()</text>

    <rect x="272" y="626" width="200" height="92" rx="10" fill="#FFFFFF" stroke="#ADB5BD" stroke-width="1.5"/>
    <text x="372" y="646" text-anchor="middle" fill="#6C757D" font-size="11" font-weight="700">Ordination</text>
    <text x="372" y="666" text-anchor="middle" fill="#1E5631" font-weight="600">morph_pca()</text>
    <text x="372" y="684" text-anchor="middle" fill="#1E5631" font-weight="600">morph_pcoa()</text>
    <text x="372" y="702" text-anchor="middle" fill="#1E5631" font-weight="600">morph_nmds()</text>

    <rect x="60" y="730" width="200" height="92" rx="10" fill="#FFFFFF" stroke="#ADB5BD" stroke-width="1.5"/>
    <text x="160" y="750" text-anchor="middle" fill="#6C757D" font-size="11" font-weight="700">Clustering</text>
    <text x="160" y="770" text-anchor="middle" fill="#1E5631" font-weight="600">morph_dendrogram()</text>
    <text x="160" y="788" text-anchor="middle" fill="#1E5631" font-weight="600">morph_kmeans()</text>
    <text x="160" y="806" text-anchor="middle" fill="#1E5631" font-weight="600">morph_nmm()</text>

    <rect x="272" y="730" width="200" height="92" rx="10" fill="#FFFFFF" stroke="#ADB5BD" stroke-width="1.5"/>
    <text x="372" y="750" text-anchor="middle" fill="#6C757D" font-size="11" font-weight="700">Group differences</text>
    <text x="372" y="770" text-anchor="middle" fill="#1E5631" font-weight="600">morph_anova()</text>
    <text x="372" y="788" text-anchor="middle" fill="#1E5631" font-weight="600">morph_kruskal()</text>
    <text x="372" y="806" text-anchor="middle" fill="#1E5631" font-weight="600">morph_permanova()</text>

    <rect x="60" y="834" width="412" height="92" rx="10" fill="#FFFFFF" stroke="#ADB5BD" stroke-width="1.5"/>
    <text x="266" y="854" text-anchor="middle" fill="#6C757D" font-size="11" font-weight="700">Discrimination among taxa</text>
    <text x="266" y="876" text-anchor="middle" fill="#1E5631" font-weight="600">morph_lda()   ·   morph_cva()   ·   morph_dapc()</text>
    <text x="266" y="898" text-anchor="middle" fill="#6C757D" font-size="11">linear discriminants · canonical variates · DAPC</text>
    <text x="266" y="914" text-anchor="middle" fill="#6C757D" font-size="11">membership and misclassification of specimens</text>

    <!-- Central column: analyses combining both matrices -->
    <rect x="500" y="626" width="200" height="196" rx="10" fill="#FFFFFF" stroke="#3B7A3A" stroke-width="1.5"/>
    <text x="600" y="646" text-anchor="middle" fill="#6C757D" font-size="11" font-weight="700">Uses both matrices</text>
    <text x="600" y="676" text-anchor="middle" fill="#1E5631" font-weight="600">geo_morph_mantel()</text>
    <text x="600" y="692" text-anchor="middle" fill="#6C757D" font-size="10.5">isolation by distance</text>
    <text x="600" y="722" text-anchor="middle" fill="#1E5631" font-weight="600">morph_autocorrelation()</text>
    <text x="600" y="738" text-anchor="middle" fill="#6C757D" font-size="10.5">clines along latitude / longitude</text>
    <text x="600" y="768" text-anchor="middle" fill="#1E5631" font-weight="600">geo_morph_rda()</text>
    <text x="600" y="784" text-anchor="middle" fill="#6C757D" font-size="10.5">traits constrained by climate</text>

    <!-- Ecogeographic groups -->
    <rect x="728" y="626" width="412" height="92" rx="10" fill="#FFFFFF" stroke="#ADB5BD" stroke-width="1.5"/>
    <text x="934" y="646" text-anchor="middle" fill="#6C757D" font-size="11" font-weight="700">Environmental space</text>
    <text x="934" y="668" text-anchor="middle" fill="#1E5631" font-weight="600">geo_bioclim_exploratory()   ·   geo_bioclim_maps()</text>
    <text x="934" y="690" text-anchor="middle" fill="#6C757D" font-size="11">rank and de-correlate bioclimatic variables</text>
    <text x="934" y="706" text-anchor="middle" fill="#6C757D" font-size="11">map occurrences over climate layers</text>

    <rect x="728" y="730" width="412" height="92" rx="10" fill="#FFFFFF" stroke="#ADB5BD" stroke-width="1.5"/>
    <text x="934" y="750" text-anchor="middle" fill="#6C757D" font-size="11" font-weight="700">Niche modelling</text>
    <text x="934" y="772" text-anchor="middle" fill="#1E5631" font-weight="600">geo_enm()   ·   geo_niche_overlap()</text>
    <text x="934" y="794" text-anchor="middle" fill="#6C757D" font-size="11">ensemble habitat suitability per taxon</text>
    <text x="934" y="810" text-anchor="middle" fill="#6C757D" font-size="11">Schoener's D, equivalency and similarity tests</text>
  </g>

  <!-- Outputs: fills the last row of the grid, spanning center + right -->
  <rect x="500" y="834" width="640" height="92" rx="10" fill="#1E5631"/>
  <text x="820" y="862" text-anchor="middle" font-size="14" font-weight="700" fill="#F8F9FA">Reproducible outputs</text>
  <text x="820" y="884" text-anchor="middle" font-size="12" fill="#DCEBD2">figures (PDF / JPEG) · Excel tables · maps and rasters · diagnostic summaries</text>
  <text x="820" y="906" text-anchor="middle" font-size="12" fill="#DCEBD2">→ integrative evidence for species delimitation</text>

  <!-- Footer: legend + note -->
  <g font-size="11.5" fill="#6C757D">
    <rect x="40" y="976" width="14" height="14" rx="2" fill="#F1F3F5" stroke="#ADB5BD" stroke-dasharray="3 2"/>
    <text x="60" y="987">Companion R packages (steps 1-2)</text>
    <rect x="300" y="976" width="14" height="14" rx="2" fill="#FFFFFF" stroke="#ADB5BD"/>
    <text x="320" y="987"><tspan fill="#1E5631" font-weight="700">green</tspan> = moRphoTaxa functions</text>
    <rect x="560" y="976" width="14" height="14" rx="2" fill="#E4EFDC" stroke="#3B7A3A"/>
    <text x="580" y="987">Input matrices for every analysis</text>
    <rect x="840" y="976" width="14" height="14" rx="2" fill="#FFFFFF" stroke="#CED4DA" stroke-dasharray="2 2"/>
    <text x="860" y="987">Manual step</text>
  </g>

  <text x="40" y="1020" font-size="12" fill="#6C757D">Analyses run on each trait block (vegetative, floral, fruit) and on their combinations, and write their outputs to dated</text>
  <text x="40" y="1038" font-size="12" fill="#6C757D">folders in the working directory. Taxon colours set in morph_matrix_setting() are reused across all figures.</text>
</svg>
